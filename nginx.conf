server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # La app maneja sus propias "pantallas" con estado de React (no usa rutas
    # de navegador tipo /subjects), así que basta con servir siempre index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cachea agresivamente los archivos con hash en el nombre (los que genera Vite).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
